name: Validate incubator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Validate ASCII diagrams
        run: python3 scripts/validate_ascii_diagrams.py

  incubator-tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/incubator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check incubator TUI
        run: cargo check
